# Surfaces outdated / vulnerable dependencies for the ecosystems this repo
# currently ships. Minor+patch updates are grouped to keep PR volume low.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-all:
        patterns: ['*']
