# Surfaces outdated / vulnerable dependencies across all four ecosystems this
# repo ships. Minor+patch updates are grouped to keep PR volume low; majors come
# as individual PRs so their breaking changes can be reviewed on their own.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-all:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /desktop/windows
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
