name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package (for example v1.0.0)'
        required: true
        type: string
        default: v2.0.5

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify (fmt, clippy, tests, UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run build
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm --dir frontend run typecheck
      - run: pnpm --dir frontend run lint
      - run: pnpm --dir frontend run test:run

  package:
    name: Package (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
            bundles: app,dmg
          - os: windows-latest
            artifact: windows-x64
            bundles: msi,nsis
          - os: ubuntu-22.04
            artifact: linux-x64
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run build
      - name: Build bundles
        run: pnpm exec tauri build --bundles "${{ matrix.bundles }}"
      - name: Create a macOS zip alongside the dmg
        if: matrix.os == 'macos-14'
        run: |
          cd target/release/bundle/macos
          ditto -c -k --keepParent HeiGate.app "HeiGate-macOS-arm64-${{ env.RELEASE_TAG }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.zip
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          files = sorted(path for path in Path('.').rglob('*') if path.is_file() and path.name != 'checksums.txt')
          names = [path.name for path in files]
          if not files:
              raise SystemExit('No release assets found for checksum generation')
          if len(names) != len(set(names)):
              raise SystemExit('Release assets must have unique filenames after flattening')

          with open('checksums.txt', 'w', encoding='utf-8', newline='\n') as output:
              for path in files:
                  digest = hashlib.sha256()
                  with path.open('rb') as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b''):
                          digest.update(chunk)
                  # GitHub Release assets are downloaded by basename.
                  output.write(f'{digest.hexdigest()}  {path.name}\n')
          PY
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            Available builds (Tauri 2 + Rust):
            - macOS 12+ on Apple silicon (arm64): `.dmg` (drag `HeiGate.app` onto `Applications`) or `.zip`
            - Windows 10/11 x64: `.msi` installer or `-setup.exe`
            - Linux x64: `.deb`, `.rpm` or `.AppImage`

            These builds are currently unsigned. macOS may require System
            Settings > Privacy & Security > Open Anyway. Windows SmartScreen
            may require More info > Run anyway. Verify the downloaded file
            against `checksums.txt` before running it.
          files: |
            dist/**
