name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  package-macos:
    name: Package macOS desktop app (Apple silicon)
    runs-on: macos-14
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify toolchains
        run: |
          go version
          go version | grep -q 'go1.27'
          swiftc --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Build macOS application bundle
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p dist/desktop/HeiGate.app/Contents/MacOS
          mkdir -p dist/desktop/HeiGate.app/Contents/Resources

          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -C backend -tags embed -trimpath -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "$GITHUB_WORKSPACE/dist/desktop/HeiGate.app/Contents/MacOS/heigate-desktop-bin" ./cmd/server

          sed "s/<string>0\.1\.0<\/string>/<string>${VERSION}<\/string>/g" \
            desktop/macos/Info.plist > dist/desktop/HeiGate.app/Contents/Info.plist
          cp desktop/macos/AppIcon.icns dist/desktop/HeiGate.app/Contents/Resources/AppIcon.icns

          swiftc -target arm64-apple-macos12.0 -O \
            -framework Cocoa -framework WebKit desktop/macos/HeiGateDesktop.swift \
            -o dist/desktop/HeiGate.app/Contents/MacOS/HeiGate
          chmod +x dist/desktop/HeiGate.app/Contents/MacOS/HeiGate
          chmod +x dist/desktop/HeiGate.app/Contents/MacOS/heigate-desktop-bin

          ditto -c -k --keepParent \
            dist/desktop/HeiGate.app "HeiGate-macOS-arm64-${VERSION}.zip"
          hdiutil create -volname HeiGate -srcfolder dist/desktop/HeiGate.app \
            -ov -format UDZO "HeiGate-macOS-arm64-${VERSION}.dmg"
          shasum -a 256 "HeiGate-macOS-arm64-${VERSION}.zip" \
            "HeiGate-macOS-arm64-${VERSION}.dmg" > checksums.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            HeiGate macOS desktop application for Apple silicon (arm64).

            This release is an unsigned application bundle. macOS may require confirmation in Privacy & Security on first launch.
          files: |
            HeiGate-macOS-arm64-*.zip
            HeiGate-macOS-arm64-*.dmg
            checksums.txt
