name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify (gofmt, vet, tests, UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm run lint
        working-directory: frontend
      - run: pnpm run test:run
        working-directory: frontend

  macos-arm64:
    name: Package macOS arm64
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the app bundle
        run: |
          VERSION="${RELEASE_TAG#v}"
          make app-macos-arm64 VERSION="$VERSION"
      - name: Verify macOS app signature
        run: codesign --verify --deep --strict --verbose=2 dist/HeiGate.app
      - name: Create macOS archives
        run: |
          VERSION="${RELEASE_TAG#v}"
          cd dist
          ditto -c -k --keepParent HeiGate.app "HeiGate-macOS-arm64-${VERSION}.zip"
          mkdir dmg-stage
          ditto HeiGate.app dmg-stage/HeiGate.app
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname HeiGate -srcfolder dmg-stage -ov -format UDZO "HeiGate-macOS-arm64-${VERSION}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            dist/HeiGate-macOS-arm64-*.zip
            dist/HeiGate-macOS-arm64-*.dmg
          if-no-files-found: error

  windows-x64:
    name: Package Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build Windows zip and installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          ./scripts/package-windows.ps1 -Version $version
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/HeiGate-Windows-x64-*.zip
            dist/HeiGate-Windows-x64-*-Setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum HeiGate-* > checksums.txt
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            Available builds:
            - macOS 12+ on Apple silicon (arm64): quit HeiGate, open the `.dmg`, drag `HeiGate.app` onto `Applications`, and choose **Replace** if an older copy exists; `.zip` is also available
            - Windows 10/11 x64: installer (`Setup.exe`) or portable `.zip`

            These builds are currently unsigned. macOS may require System
            Settings > Privacy & Security > Open Anyway. Windows SmartScreen
            may require More info > Run anyway. Verify the downloaded file
            against `checksums.txt` before running it.
          files: |
            dist/HeiGate-macOS-arm64-*.zip
            dist/HeiGate-macOS-arm64-*.dmg
            dist/HeiGate-Windows-x64-*.zip
            dist/HeiGate-Windows-x64-*-Setup.exe
            dist/checksums.txt
