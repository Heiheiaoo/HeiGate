<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">HeiGate</title>
  <desc id="desc">A gateway arch surrounding an H, representing local API routing.</desc>
  <defs>
    <linearGradient id="heigate-background" x1="72" y1="40" x2="440" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#122033"/>
      <stop offset=".55" stop-color="#0A1526"/>
      <stop offset="1" stop-color="#050C18"/>
    </linearGradient>
    <linearGradient id="heigate-mark" x1="132" y1="136" x2="380" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset=".48" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
